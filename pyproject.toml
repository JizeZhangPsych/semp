[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semp"
version = "2.2.0"
description = "Simultaneous EEG-fMRI Preprocessing Toolbox"
requires-python = ">=3.8"
# osl-ephys is the primary dependency (install into the same conda env).
# It also ships the bundled NIfTI mask / parcellation files used by
# semp.utils.parcel_plot and semp.visualize, so no separate atlas download.
# osl-manual-ica is a hard dependency: semp.preprocessing.wrappers.ica
# re-exports its ``manual_ica`` so existing semp configs keep working
# after the extraction.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "scikit-learn",
    "mne",
    "nibabel",
    "nilearn",
    "matplotlib",
    "seaborn",
    "natsort",
    "parse",
    "tqdm",
    "glmtools",
    "osl-manual-ica>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
