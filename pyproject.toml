[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semp"
version = "2.1.0"
description = "Simultaneous EEG-fMRI Preprocessing Toolbox"
requires-python = ">=3.8"
# osl-ephys is the primary optional dependency (install into the same conda env).
# osl-dynamics is no longer required; its routines are bundled in semp.utils.osld_extension.
# osl-manual-ica is a hard dependency: semp.preprocessing.wrappers.ica re-exports
# its ``manual_ica`` so existing semp configs keep working after the extraction.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "torch",
    "scikit-learn",
    "mne",
    "nibabel",
    "nilearn",
    "matplotlib",
    "seaborn",
    "natsort",
    "parse",
    "tqdm",
    "glmtools",
    "osl-manual-ica>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
